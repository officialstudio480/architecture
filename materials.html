</header><main class="container page"><div class="page-heading"><p class="eyebrow">MATERIAL SEARCH</p><h1>建築パース素材を検索</h1><p>木・石・コンクリート・タイルなどをキーワードで探せます。</p></div><section class="search-box"><input id="q" type="search" placeholder="例：木、コンクリート、石、タイル"><select id="cat"><option value="">すべてのカテゴリ</option><option>木材</option><option>石・コンクリート</option><option>タイル・床</option><option>金属</option><option>壁・仕上げ</option></select></section><p id="count" class="result-count"></p><div id="results" class="card-grid"></div></main><footer class="site-footer">

</footer><script>const data=[["ナチュラルオーク", "木材", "木 オーク フローリング 床", "明るく温かい印象の木質素材。", "木"], ["ウォールナット", "木材", "木 ウォールナット 家具", "落ち着いた濃色の木材。", "木"], ["杉板", "木材", "木 杉 外壁 ルーバー", "外壁・ルーバー・内装などに。", "木"], ["打放しコンクリート", "石・コンクリート", "コンクリート RC 壁", "構造体を見せるミニマルな表現に。", "RC"], ["御影石", "石・コンクリート", "石 granite 外壁 床", "外壁・床・カウンターなどに。", "石"], ["大理石", "石・コンクリート", "石 marble 高級 床 壁", "床や壁のアクセントに。", "石"], ["磁器タイル", "タイル・床", "タイル 磁器 床 外壁", "規則的な目地を持つ床・壁に。", "TL"], ["フローリング", "タイル・床", "床 木 フローリング", "住宅・店舗の床表現に。", "FL"], ["モルタル", "壁・仕上げ", "モルタル グレー 壁 床", "左官仕上げらしいマットな質感。", "MT"], ["漆喰", "壁・仕上げ", "漆喰 白 壁 左官", "白く柔らかな壁面に。", "漆"], ["レンガ", "壁・仕上げ", "レンガ brick 外壁 壁", "外壁・内壁のアクセントに。", "BR"], ["ガルバリウム鋼板", "金属", "金属 ガルバ 外壁 屋根", "外壁や屋根の金属質感に。", "GB"], ["アルミ", "金属", "金属 アルミ サッシ", "サッシ・フレームなどに。", "AL"], ["ガラス", "金属", "ガラス 窓 カーテンウォール", "窓・カーテンウォールなどに。", "GL"]];const inp=document.getElementById("q");const cat=document.getElementById("cat");const res=document.getElementById("results");const count=document.getElementById("count");const urlQuery=new URLSearchParams(location.search).get("q");if(urlQuery)inp.value=urlQuery;function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}function render(){const q=inp.value.trim().toLowerCase(),c=cat.value;const hits=data.filter(x=>(!q||x.join(" ").toLowerCase().includes(q))&&(!c||x[1]===c));count.textContent=hits.length+"件";res.innerHTML=hits.map(x=>`<article class="card"><span class="tag">${esc(x[1])}</span><h2>${esc(x[0])}</h2><p>${esc(x[3])}</p><p class="muted">キーワード：${esc(x[2])}</p><a class="button secondary" target="_blank" rel="noopener" href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(x[0]+" 建築 素材")}">Googleで素材を検索 ↗</a></article>`).join("")||'<div class="empty">該当する素材がありません。別のキーワードを試してください。</div>';}inp.addEventListener("input",render);cat.addEventListener("change",render);render();
</script>
<script>
  // スマートフォン用ハンバーガーメニュー
  const menuButton = document.getElementById("menuToggle");
  const mainNav = document.getElementById("mainNav");

  if (menuButton && mainNav) {
    menuButton.addEventListener("click", () => {
      const isOpen = mainNav.classList.toggle("open");
      menuButton.setAttribute("aria-expanded", isOpen);
    });

    mainNav.querySelectorAll("a").forEach((link) => {
      link.addEventListener("click", () => {
        mainNav.classList.remove("open");
        menuButton.setAttribute("aria-expanded", "false");
      });
    });
  }
</script>
