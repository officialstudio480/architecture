<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>縮尺計算 | 建築サポート</title><link rel="stylesheet" href="style.css"></head><body>
<!-- このページの内容を編集するときは、このHTMLファイルを開いてください。 --><header class="site-header">
  <div class="container header-inner">
    <a class="logo" href="index.html">
      <span class="logo-mark"><img src="IMG/logo.png" alt=""></span>
      <span>建築ノード</span>
    </a>

    <!-- PCでは各機能を直接表示。スマホではハンバーガーにまとめます。 -->
    <button class="menu-toggle" id="menuToggle" aria-label="メニュー" aria-expanded="false">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav class="main-nav" id="mainNav">
      <a href="scale.html">縮尺計算</a>
      <a href="calculator.html">建築計算</a>
      <a href="law.html">法令検索</a>
      <a href="materials.html">素材検索</a>
      <a href="search.html">SEARCH</a>
      <a href="about.html">ABOUT</a>
    </nav>
  </div>
</header><main class="container page"><div class="page-heading"><p class="eyebrow">SCALE</p><h1>縮尺計算</h1><p>実寸と図面上の寸法を相互変換します。</p></div><div class="calc-form"><div class="calc-row"><div><label>方向</label><select id="mode"><option value="realToDrawing">実寸 → 図面</option><option value="drawingToReal">図面 → 実寸</option></select></div><div><label>縮尺</label><select id="scale"><option value="20">1/20</option><option value="50">1/50</option><option value="100" selected>1/100</option><option value="200">1/200</option><option value="500">1/500</option></select></div></div><label>長さ（mm）</label><input id="value" type="number" placeholder="例：5000"><button class="button" id="calc" style="margin-top:14px">計算</button><div class="result" id="result">ここに結果が表示されます。</div></div></main><footer class="site-footer">
  <div class="container">
    建築ノード
    <div class="footer-links">
      <a href="index.html">ホーム</a>
      <a href="about.html">ABOUT</a>
      <a href="scale.html">縮尺計算</a>
      <a href="calculator.html">建築計算</a>
      <a href="law.html">法令</a>
      <a href="materials.html">素材</a>
    </div>
  </div>
</footer><script>document.getElementById("calc").onclick=()=>{const v=Number(document.getElementById("value").value),s=Number(document.getElementById("scale").value),m=document.getElementById("mode").value;if(!v)return;document.getElementById("result").textContent=`結果：${(m==="realToDrawing"?v/s:v*s).toLocaleString()} mm`}</script>
<script>
  // スマートフォン用ハンバーガーメニュー
  const menuButton = document.getElementById("menuToggle");
  const mainNav = document.getElementById("mainNav");

  if (menuButton && mainNav) {
    menuButton.addEventListener("click", () => {
      const isOpen = mainNav.classList.toggle("open");
      menuButton.setAttribute("aria-expanded", isOpen);
    });

    mainNav.querySelectorAll("a").forEach((link) => {
      link.addEventListener("click", () => {
        mainNav.classList.remove("open");
        menuButton.setAttribute("aria-expanded", "false");
      });
    });
  }
</script>
</body></html>
