<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>メンテナンス中｜建築ノード</title>
  <style>
    :root{
      --bg:#f5f3ee;
      --paper:#fffdf8;
      --ink:#242424;
      --muted:#73736d;
      --line:#dedbd2;
      --accent:#7b8ea0;
    }
    *{box-sizing:border-box}
    html{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink)}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;overflow:hidden}
    .wrap{width:min(760px,100%);position:relative}
    .panel{position:relative;background:rgba(255,253,248,.94);border:1px solid var(--line);padding:clamp(34px,7vw,72px);box-shadow:0 18px 50px rgba(35,35,35,.07);overflow:hidden}
    .eyebrow{font-size:12px;letter-spacing:.13em;color:var(--muted);margin-bottom:18px}
    h1{font-size:clamp(34px,6vw,58px);line-height:1.08;letter-spacing:-.03em;margin:0 0 18px;font-weight:800}
    p{font-size:15px;line-height:1.9;margin:0;color:#45453f;max-width:44em}
    .status{display:inline-flex;align-items:center;gap:9px;margin-top:28px;padding:10px 14px;border:1px solid var(--line);background:#faf8f2;font-size:13px}
    .dot{width:8px;height:8px;border-radius:50%;background:#8b8b86;box-shadow:0 0 0 0 rgba(123,142,160,.35);animation:pulse 2.2s infinite}
    .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}
    a{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink);border:1px solid #bdb9ae;padding:12px 16px;font-size:13px;background:#fff}
    a.primary{background:#242424;color:#fff;border-color:#242424}
    .note{margin-top:28px;font-size:12px;color:var(--muted)}
    .shape{position:absolute;pointer-events:none;opacity:.48}
    .square{width:110px;height:110px;border:1px solid #c8c5bc;right:-32px;top:46px;transform:rotate(12deg);animation:float 7s ease-in-out infinite}
    .circle{width:150px;height:150px;border:1px solid #d0cdc4;border-radius:50%;left:-74px;bottom:-60px;animation:float2 8s ease-in-out infinite}
    .line{height:1px;background:#d7d4cb;width:180px;right:8%;bottom:16%;animation:scan 5s linear infinite}
    @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(123,142,160,.25)}50%{box-shadow:0 0 0 8px rgba(123,142,160,0)}}
    @keyframes float{0%,100%{transform:rotate(12deg) translateY(0)}50%{transform:rotate(16deg) translateY(10px)}}
    @keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(8px,-8px)}}
    @keyframes scan{0%{transform:translateX(-50px);opacity:.05}40%{opacity:.55}100%{transform:translateX(50px);opacity:.05}}
    @media (max-width:600px){
      body{padding:16px}
      .panel{text-align:center;padding:36px 24px}
      p{margin-inline:auto}
      .actions{justify-content:center}
      a{min-width:180px}
      .square{width:72px;height:72px;right:-24px;top:28px}
      .circle{width:100px;height:100px;left:-52px;bottom:-40px}
    }
    @media (prefers-reduced-motion:reduce){.dot,.square,.circle,.line{animation:none}}
  </style>
</head>
<body>
  <main class="wrap" aria-labelledby="title">
    <section class="panel">
      <!-- メンテナンス中の一時ページです。通常営業に戻すときは、サイト本体の index.html に戻してください。 -->
      <div class="shape square" aria-hidden="true"></div>
      <div class="shape circle" aria-hidden="true"></div>
      <div class="shape line" aria-hidden="true"></div>

      <div class="eyebrow">ARCHITECTURE TOOL / TEMPORARILY UNAVAILABLE</div>
      <h1 id="title">ただいまメンテナンス中です</h1>
      <p>建築ノードは、より使いやすくするための調整を行っています。しばらく時間をおいてから、もう一度お試しください。</p>

      <div class="status"><span class="dot" aria-hidden="true"></span>メンテナンス中</div>

      <div class="actions">
        <a class="primary" href="https://x.com/idx_dsn_offic" target="_blank" rel="noopener noreferrer">公式Xを見る</a>
        <a href="javascript:location.reload()">ページを再読み込み</a>
      </div>

      <div class="note">復旧後は通常どおりご利用いただけます。</div>
    </section>
  </main>
</body>
</html>
